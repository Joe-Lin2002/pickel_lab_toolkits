<!DOCTYPE html>
<html lang="en" class="protected-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meeting Schedule · Pickel Lab Toolkits</title>
  <link rel="stylesheet" href="/site.css?v=1.1">
  <link rel="stylesheet" href="/site-shell.css?v=1.1">
  <script src="/auth-guard.js?v=1.1"></script>
  <script src="/site-shell.js?v=1.1" defer></script>
</head>
<body>
  <pickel-site-banner></pickel-site-banner>

  <main class="app">
    <header class="page-title-block">
      <h1>Meeting Schedule</h1>
      <p>View the shared meeting calendar in weekly or monthly format.</p>
    </header>

    <section class="meeting-controls-card">
      <div class="meeting-navigation">
        <div class="meeting-week-controls">
          <button id="previous-period" type="button">← Previous</button>
          <button id="current-period" type="button">Today</button>
          <button id="next-period" type="button">Next →</button>
        </div>

        <div class="meeting-toolbar-right">
          <div class="meeting-view-switch" role="group" aria-label="Calendar view">
            <button id="week-view-button" class="meeting-view-button active" type="button" aria-pressed="true">Week</button>
            <button id="month-view-button" class="meeting-view-button" type="button" aria-pressed="false">Month</button>
          </div>

          <div class="meeting-timezone-control">
            <label for="meeting-timezone-select">Time zone</label>
            <select id="meeting-timezone-select">
              <option value="America/New_York">Eastern Time</option>
              <option value="America/Chicago">Central Time</option>
              <option value="America/Denver">Mountain Time</option>
              <option value="America/Los_Angeles">Pacific Time</option>
            </select>
          </div>

          <button id="refresh-meetings" type="button">↻ Refresh</button>
        </div>
      </div>

      <div class="meeting-range-row">
        <strong id="meeting-period-label">Loading...</strong>
        <span id="meeting-sync-status" class="meeting-sync-status">Loading calendar...</span>
      </div>
    </section>

    <section id="meeting-week" class="meeting-week" aria-label="Weekly meeting schedule"></section>
    <section id="meeting-month-wrap" class="meeting-month-wrap hidden" aria-label="Monthly meeting schedule">
      <div id="meeting-month-grid" class="meeting-month-grid"></div>
    </section>

    <p id="meeting-status-message" class="status-message" role="status" aria-live="polite"></p>
  </main>

  <pickel-site-footer></pickel-site-footer>

  <dialog id="meeting-details-dialog" class="meeting-details-dialog">
    <div class="meeting-details-content">
      <div class="meeting-details-header">
        <div>
          <p class="meeting-details-kicker">Meeting details</p>
          <h2 id="meeting-details-title">Meeting</h2>
        </div>
        <button id="meeting-details-close" class="meeting-details-close" type="button" aria-label="Close meeting details">×</button>
      </div>

      <dl class="meeting-details-list">
        <div>
          <dt>When</dt>
          <dd id="meeting-details-time">—</dd>
        </div>
        <div id="meeting-details-location-row">
          <dt>Location</dt>
          <dd id="meeting-details-location">—</dd>
        </div>
        <div id="meeting-details-recurrence-row">
          <dt>Recurrence</dt>
          <dd>Recurring meeting</dd>
        </div>
        <div id="meeting-details-description-row">
          <dt>Description</dt>
          <dd id="meeting-details-description">—</dd>
        </div>
      </dl>
    </div>
  </dialog>

  <script>
    window.pickelAuth.requireAuth().then(authenticated => {
      if (!authenticated) return;
      const script = document.createElement("script");
      script.src = "/meeting-schedule.js?v=1.1";
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
