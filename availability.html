<!DOCTYPE html>
<html lang="en" class="protected-page">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Availability · Pickel Lab Toolkits</title>
  <link rel="stylesheet" href="/site.css?v=1.1">
  <link rel="stylesheet" href="/site-shell.css?v=1.1">
  <script src="/auth-guard.js?v=1.1"></script>
  <script src="/site-shell.js?v=1.1" defer></script>
</head>
<body>
  <pickel-site-banner></pickel-site-banner>

  <main class="app">
    <header class="page-title-block">
      <h1>Weekly Availability</h1>
      <p>Coordinate recurring weekly availability across the group.</p>
    </header>

    <section class="controls-card">
      <div class="member-controls">
        <label for="member-select">View</label>
        <select id="member-select">
          <option value="">All members</option>
        </select>

        <button id="new-member-button" type="button">Add my name</button>

        <div class="timezone-control">
          <label for="timezone-select">Time zone</label>
          <select id="timezone-select">
            <option value="America/New_York">Eastern Time</option>
            <option value="America/Chicago">Central Time</option>
            <option value="America/Denver">Mountain Time</option>
            <option value="America/Los_Angeles">Pacific Time</option>
          </select>
        </div>
      </div>

      <div id="editor-controls" class="editor-controls hidden">
        <span class="control-label">Select a color:</span>
        <button class="color-button green-button selected" type="button" data-status="green">Green — Fully available</button>
        <button class="color-button yellow-button" type="button" data-status="yellow">Yellow — Prefer not</button>
        <button class="color-button red-button" type="button" data-status="red">Red — Conflict</button>
        <button id="clear-button" class="clear-button" type="button">Clear</button>
        <button id="save-button" class="save-button" type="button">Save Availability</button>
      </div>

      <p id="mode-message" class="mode-message">Showing availability for all members.</p>
      <p id="last-updated-message" class="last-updated-message">Last updated: —</p>
    </section>

    <section class="legend">
      <span><span class="legend-color green"></span>Fully available</span>
      <span><span class="legend-color yellow"></span>Prefer not</span>
      <span><span class="legend-color red"></span>Conflict</span>
      <span><span class="legend-color empty"></span>No response</span>
    </section>

    <section class="availability-card">
      <div id="availability-table" class="availability-table"></div>
    </section>

    <div id="availability-details" class="availability-details hidden" role="dialog" aria-live="polite" aria-label="Availability details">
      <div class="availability-details-header">
        <strong id="availability-details-title">Availability details</strong>
        <button id="availability-details-close" type="button" aria-label="Close availability details">×</button>
      </div>
      <div id="availability-details-content"></div>
    </div>

    <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
  </main>

  <pickel-site-footer></pickel-site-footer>

  <dialog id="name-dialog">
    <form id="name-form">
      <h2>Add your name</h2>
      <label for="new-member-name">Name</label>
      <input id="new-member-name" type="text" maxlength="50" autocomplete="name" required>
      <p id="name-error" class="form-error" role="alert"></p>

      <div class="dialog-buttons">
        <button id="name-cancel-button" type="button">Cancel</button>
        <button class="primary-button" type="submit">Continue</button>
      </div>
    </form>
  </dialog>

  <script>
    window.pickelAuth.requireAuth().then(authenticated => {
      if (!authenticated) return;
      const script = document.createElement("script");
      script.src = "/availability.js?v=1.1";
      document.body.appendChild(script);
    });
  </script>
</body>
</html>
