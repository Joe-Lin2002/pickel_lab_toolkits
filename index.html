<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Pickel Lab Equipment Schedule</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>Equipment Schedule</h1>
        <p>Pickel Lab</p>
      </div>

      <div class="date-controls">
        <button id="previous-day" type="button">←</button>
        <button id="today-button" type="button">Today</button>
        <button id="next-day" type="button">→</button>

        <input id="date-picker" type="date" />
      </div>
    </header>

    <section class="schedule-card">
      <div id="schedule" class="schedule"></div>
    </section>

    <p id="status-message" class="status-message"></p>
  </main>

  <dialog id="reservation-dialog">
    <form id="reservation-form">
      <h2>Add Reservation</h2>

      <input id="reservation-id" type="hidden" />
      <input id="resource-id" type="hidden" />

      <label>
        Equipment
        <input id="resource-name" type="text" disabled />
      </label>

      <label>
        Your name
        <input
          id="person-name"
          type="text"
          maxlength="50"
          required
        />
      </label>

      <label>
        Description
        <input
          id="reservation-title"
          type="text"
          maxlength="100"
          placeholder="Example: UCNP heating experiment"
          required
        />
      </label>

      <div class="time-inputs">
        <label>
          Start
          <input
            id="start-time"
            type="time"
            step="900"
            required
          />
        </label>

        <label>
          End
          <input
            id="end-time"
            type="time"
            step="900"
            required
          />
        </label>
      </div>

      <p id="form-error" class="form-error"></p>

      <div class="dialog-buttons">
        <button
          id="delete-button"
          class="danger-button hidden"
          type="button"
        >
          Delete
        </button>

        <span class="button-spacer"></span>

        <button
          id="cancel-button"
          type="button"
        >
          Cancel
        </button>

        <button
          class="primary-button"
          type="submit"
        >
          Save
        </button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
